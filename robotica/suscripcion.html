<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suscripción | Robotic Center</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-form">
<header>
  <h1>Robotic Center</h1>
  <p>Suscríbete y sé parte de la nueva generación de creadores.</p>
</header>

<main class="contenido-form">
  <h2>Formulario de suscripción</h2>
  <form class="form-columna" action="#" method="post">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
    </div>
    <div class="campo">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
    </div>
    <button type="submit">Enviar</button>
  </form>
  <a class="boton volver" href="index.html">Volver a la página principal</a>
</main>

<footer>
  <p>Contacto: info@roboricua.org | (787) 555-5555</p>
</footer>
</body>
</html>

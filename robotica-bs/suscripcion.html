<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suscripción | Robotic Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <header class="bg-primary text-white text-center p-5">
    <h1>Robotic Center</h1>
    <p>Suscríbete y sé parte de la nueva generación de creadores.</p>
  </header>

  <main class="container p-5">
    <h2>Formulario de suscripción</h2>

    <form action="#" method="post">
      <div class="mb-3">
        <label for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" required>
      </div>
      <div class="mb-3">
        <label for="correo">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" name="correo" required>
      </div>
      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>

    <!-- Enlace pagina principal-->
    <a href="index.html" class="btn btn-secondary mt-3">Volver a la página principal</a>
  </main>

  <footer class="bg-dark text-white text-center p-4">
    <p class="mb-0">Contacto: info@roboticcenter.org | (787) 555-5555 | Camuy, Puerto Rico</p>
  </footer>

</body>

</html>
